<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mein Oktopus-Shop</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; text-align: center; padding: 20px; }
        .card { background: white; max-width: 400px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        h1 { color: #0077b6; }
        .price-tag { font-size: 24px; font-weight: bold; color: #00b4d8; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🐙 Oktopus-Konfigurator</h1>
        
        <p>Stelle dir deinen beweglichen Oktopus zusammen!</p>
        
        <label for="size">Größe wählen:</label>
        <select id="size" onchange="berechnePreis()">
            <option value="klein">Klein (Basis) - 5,00 €</option>
            <option value="mittel">Mittel (+ 2,00 €)</option>
            <option value="riesig">Riesig (+ 5,00 €)</option>
        </select>

        <label for="color">Farbe & Filament-Typ:</label>
        <select id="color" onchange="berechnePreis()">
            <option value="standard">Standard-Farbe (Rot, Blau, Grün)</option>
            <option value="special">Spezial-Filament (Regenbogen / Glow-in-the-dark) (+ 1,50 €)</option>
        </select>

        <div class="price-tag">Preis: <span id="finaler-preis">5,00</span> €</div>
        
        <button onclick="bestellungAbschicken()">Jetzt bestellen</button>
    </div>

    <script>
        function berechnePreis() {
            let basisPreis = 5.00;
            
            let gewaehlteGroesse = document.getElementById("size").value;
            let gewaehlteFarbe = document.getElementById("color").value;

            if (gewaehlteGroesse === "mittel") {
                basisPreis = basisPreis + 2.00;
            } else if (gewaehlteGroesse === "riesig") {
                basisPreis = basisPreis + 5.00;
            }

            if (gewaehlteFarbe === "special") {
                basisPreis = basisPreis + 1.50;
            }

            let formatierterPreis = basisPreis.toFixed(2).replace(".", ",");
            document.getElementById("finaler-preis").innerText = formatierterPreis;
        }

        function bestellungAbschicken() {
            alert("Danke für deine Test-Bestellung! Dein Oktopus wird bald gedruckt. 🐙");
        }
    </script>

</body>
</html>
